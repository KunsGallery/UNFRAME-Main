[build]
  publish = "dist"
  command = "npm run check && npm test && npm run build"
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
[[redirects]]
  from = "/exhibition/:id"
  to = "/detail.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-store"

[[redirects]]
  from = "/exhibition"
  to = "/exhibition.html"
  status = 200
[[redirects]]
  from = "/exhibition/"
  to = "/exhibition.html"
  status = 200
[[redirects]]
  from = "/exhibitions/:id"
  to = "/exhibition/:id"
  status = 301

[[redirects]]
  from = "/project"
  to = "/project.html"
  status = 200
[[redirects]]
  from = "/project/"
  to = "/project.html"
  status = 200

[[redirects]]
  from = "/project-lab"
  to = "/project-lab.html"
  status = 200
[[redirects]]
  from = "/project-lab/"
  to = "/project-lab.html"
  status = 200
[[headers]]
  for = "/project-lab*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/project-scroll"
  to = "/project-scroll.html"
  status = 200
[[redirects]]
  from = "/project-scroll/"
  to = "/project-scroll.html"
  status = 200
[[headers]]
  for = "/project-scroll*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/virtual-gallery"
  to = "/virtual-gallery.html"
  status = 200
[[redirects]]
  from = "/virtual-gallery/:id"
  to = "/virtual-gallery.html"
  status = 200

[[redirects]]
  from = "/virtual-gallery/submission/:id"
  to = "/virtual-gallery.html"
  status = 200
[[redirects]]
  from = "/artist-studio/:id"
  to = "/artist-studio.html"
  status = 200
[[headers]]
  for = "/artist-studio*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
