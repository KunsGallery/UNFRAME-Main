<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>버추얼 갤러리 — UNFRAME</title><meta name="description" content="언프레임의 전시를 온라인 공간에서 만나보세요."><script>if(/^\/virtual-gallery\/submission\//.test(location.pathname)&&/[?&]embed=1(&|$)/.test(location.search))document.documentElement.classList.add('embed-preview');</script><style>.embed-preview #start-overlay{display:none!important}</style><link rel="stylesheet" href="/assets/virtual-room.css"><link rel="stylesheet" href="/assets/virtual-gallery.css"></head><body>
<!-- Experience: the supplied forest-view room leads; saved artworks and their exhibition define each gallery. Shared UNFRAME cream/blue editorial controls recede from the art. -->
<canvas id="webgl-canvas" aria-label="버추얼 전시 공간"></canvas><div id="crosshair"></div><div id="hover-status-pill"><span id="hover-status-text"></span></div>
<header class="top-header"><a href="/" class="virtual-brand">UNFRAME</a><h1 class="gallery-title" id="gallery-title">버추얼 갤러리</h1><p class="gallery-subtitle" id="gallery-subtitle"></p><a class="virtual-return" data-return href="/exhibition">← 전시로 돌아가기</a><p id="preview-mode" hidden>관리자 미리보기 · 아직 공개되지 않은 내용입니다.</p></header>
<div class="top-right-panel"><button class="glass-btn hud-menu" id="btn-menu" type="button" aria-expanded="false" aria-controls="hud-menu-items">메뉴</button><div class="hud-menu-items" id="hud-menu-items"><div class="top-actions"><button class="glass-btn" id="btn-list">작품 목록</button><button class="glass-btn" id="btn-tour">가이드 투어</button><button class="glass-btn" id="btn-help">전시 정보</button></div><div class="wall-jumps" role="group" aria-label="벽으로 이동"><button class="glass-btn" data-wall="front">전면 벽</button><button class="glass-btn" data-wall="left">좌측 벽</button><button class="glass-btn" data-wall="right">우측 벽</button></div><div class="theme-header"><button class="glass-btn" id="btn-fullscreen" aria-label="전체화면 전환">전체화면</button><button class="glass-btn" id="btn-close">입구로</button></div></div></div>
<nav class="nav-controls-container" aria-label="공간 이동"><button class="nav-btn" id="nav-forward" aria-label="앞으로 이동">↑</button><div class="nav-row"><button class="nav-btn" id="nav-left" aria-label="왼쪽 이동">←</button><button class="nav-btn" id="nav-backward" aria-label="뒤로 이동">↓</button><button class="nav-btn" id="nav-right" aria-label="오른쪽 이동">→</button></div></nav>
<div class="bottom-left-panel"><p class="keyboard-hint">드래그로 둘러보기 · WASD 또는 화살표로 이동<br>작품을 누르면 가까이 감상할 수 있습니다.</p></div><p id="toast-msg" role="status" aria-live="polite"></p>
<div id="tour-bar" role="region" aria-label="가이드 투어" hidden><span id="tour-progress"></span><strong id="tour-title"></strong><div class="tour-bar-actions"><button type="button" id="tour-prev">이전</button><button type="button" id="tour-detail">상세 보기</button><button type="button" id="tour-forward">다음</button><button type="button" id="tour-end">투어 종료</button></div></div>
<dialog class="artwork-modal-overlay" id="art-modal" aria-labelledby="modal-title-en"><div class="artwork-modal-content"><button class="modal-close-btn" id="modal-close-btn" aria-label="작품 상세 닫기">닫기</button><div class="artwork-modal-img-wrap"><img class="artwork-modal-img" id="modal-img" src="/assets/projects/up.webp" alt=""></div><div class="artwork-modal-info"><div><div class="art-title-header"><h2 class="art-title-en" id="modal-title-en"></h2><p class="art-title-ko" id="modal-title-ko"></p><p class="art-artist" id="modal-artist"></p></div><dl class="art-specs"><div class="art-spec-row"><dt class="spec-label">작품명</dt><dd class="spec-value" id="modal-spec-title"></dd></div><div class="art-spec-row"><dt class="spec-label">제작연도</dt><dd class="spec-value" id="modal-spec-year"></dd></div><div class="art-spec-row"><dt class="spec-label">재료</dt><dd class="spec-value" id="modal-spec-medium"></dd></div><div class="art-spec-row"><dt class="spec-label">크기 (세로 × 가로)</dt><dd class="spec-value" id="modal-spec-dimensions"></dd></div><div class="art-spec-row"><dt class="spec-label">가격</dt><dd class="spec-value" id="modal-spec-price"></dd></div></dl><p class="art-desc" id="modal-desc"></p></div><div class="modal-btn-row"><button class="action-btn-primary" id="modal-back-btn">공간으로 돌아가기</button><button class="action-btn-primary" id="tour-next" hidden>다음 작품</button><button class="action-btn-primary" id="tour-stop">감상 마치기</button></div></div></div></dialog>
<dialog id="works-dialog" aria-labelledby="works-title"><div class="virtual-dialog-heading"><h2 id="works-title">전시 작품</h2><button id="works-close">닫기</button></div><div id="works-list"></div></dialog>
<section id="start-overlay"><div class="start-card"><h2 class="start-title" id="start-title">전시를 불러오고 있습니다.</h2><p class="start-subtitle" id="start-subtitle">잠시만 기다려주세요.</p><div id="start-info" class="start-info"></div><p id="start-help">드래그하거나 손가락으로 화면을 돌려보세요.<br>이동 버튼과 키보드로 공간을 둘러볼 수 있습니다.<br>작품 목록에서도 각 작품을 선택할 수 있습니다.</p><p id="start-progress" role="status" aria-live="polite"></p><button class="enter-btn" id="enter-gallery-btn" disabled>갤러리 입장하기</button><a class="virtual-return" data-return href="/exhibition">전시로 돌아가기</a></div></section>
<script src="/assets/vendor/three-r128.min.js"></script><script src="/assets/vendor/tween-18.6.4.js"></script><script type="module" src="/js/virtual-gallery.js"></script></body></html>
