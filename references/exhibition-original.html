<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNFRAME - EXHIBITION</title>
    
    <!-- Tailwind CSS (별도 설치 없이 디자인을 적용하기 위한 도구) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 아이콘 라이브러리 (Lucide Icons) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* 기본 폰트 설정 (원하시면 변경 가능) */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; }
        
        /* 텍스트 드래그 색상 설정 (브랜드 아이덴티티) */
        ::selection { background-color: black; color: white; }
    </style>
</head>
<body class="bg-white text-gray-900 min-h-screen">

    <!-- 
      =================================================================
      [설정 및 데이터 영역 (JavaScript)]
      이 아래의 <script> 태그 안의 내용을 수정하면 페이지 내용이 바뀝니다.
      =================================================================
    -->
    <script>
        // 1. 페이지 설정 (가로폭, 텍스트 등)
        const PAGE_CONFIG = {
            layout: {
                // 각 섹션의 최대 가로폭을 픽셀(px) 단위로 설정하세요.
                headerWidth: '1280px',        
                currentSectionWidth: '1280px',
                archiveSectionWidth: '1280px',
                // footerWidth 설정 삭제됨
            },
            text: {
                pageTitle: "EXHIBITIONS",
                pageSubtitle: "언프레임이 큐레이션한 동시대 예술의 흐름.<br />경계를 넘나드는 다양한 전시를 만나보세요.",
                currentSectionTitle: "NOW SHOWING",
                archiveSectionTitle: "ARCHIVE",
                archiveSubtitle: "지난 전시 기록들을 모아두었습니다.",
            }
        };

        // 2. 현재 진행 중인 전시 데이터
        const CURRENT_EXHIBITIONS_DATA = [
            {
                id: 1,
                title: "Resonance: 빛과 소리의 공명",
                date: "2024.01.15 - 2024.03.30",
                location: "Main Hall, Unframe Seoul",
                status: "Now Showing",
                description: "디지털 미디어 아티스트 5인이 선보이는 공감각적 체험 전시. 빛의 파장과 소리의 진동이 만들어내는 새로운 공간을 경험하세요.",
                color: "#4a5568" // 이미지 위에 덮일 색상 틴트
            }
        ];

        // 3. 지난 전시 데이터 (아카이브)
        const PAST_EXHIBITIONS_DATA = [
            {
                id: 2,
                title: "Deconstruction: 해체된 일상",
                date: "2023.10.01 - 2023.12.31",
                year: "2023", // 필터링을 위한 연도 정보
                location: "Gallery A",
                status: "Closed",
                description: "일상적인 오브제를 해체하고 재조합하여 사물의 본질을 탐구하는 현대 조각전.",
                color: "#e53e3e"
            },
            {
                id: 3,
                title: "Urban Jungle: 도시의 틈",
                date: "2023.07.15 - 2023.09.20",
                year: "2023",
                location: "Gallery B",
                status: "Closed",
                description: "회색빛 도시 속에서 피어나는 생명력을 포착한 사진 및 설치 미술 전시.",
                color: "#38a169"
            },
            {
                id: 4,
                title: "Binary Emotions",
                date: "2023.04.01 - 2023.06.30",
                year: "2023",
                location: "Main Hall",
                status: "Closed",
                description: "AI가 해석한 인간의 감정, 그리고 그 사이에서 발생하는 오류를 시각화한 미디어 아트.",
                color: "#3182ce"
            },
            {
                id: 5,
                title: "Analog Dreams",
                date: "2023.01.10 - 2023.03.20",
                year: "2023",
                location: "Gallery A",
                status: "Closed",
                description: "디지털 시대에 다시 돌아보는 아날로그의 따뜻함과 불완전함의 미학.",
                color: "#d69e2e"
            },
            {
                id: 6,
                title: "Zero Point",
                date: "2022.11.01 - 2022.12.31",
                year: "2022",
                location: "Unframe Archive",
                status: "Closed",
                description: "언프레임의 시작점. 창작의 0점에서 시작되는 무한한 가능성을 이야기하다.",
                color: "#805ad5"
            }
        ];
    </script>

    <!-- 
      =================================================================
      [HTML 구조 영역]
      화면에 보이는 실제 태그들입니다. id 값을 통해 스크립트와 연결됩니다.
      =================================================================
    -->

    <!-- Navbar가 제거된 상태입니다. 기존 페이지의 상단 메뉴 아래에 이 코드를 붙여넣으세요. -->

    <!-- 1. 헤더 섹션 (Title) -->
    <header class="pt-32 pb-12 md:pt-40 md:pb-20 px-6 mx-auto" id="header-section">
        <h1 class="text-5xl md:text-8xl font-bold tracking-tighter mb-6" id="page-title"></h1>
        <p class="text-lg md:text-xl text-gray-500 max-w-2xl leading-relaxed" id="page-subtitle"></p>
    </header>

    <!-- 2. 현재 전시 섹션 (Now Showing) -->
    <section class="px-6 pb-24 mx-auto border-b border-gray-100" id="current-section">
        <div class="flex items-center justify-between mb-8">
            <h2 class="text-xl md:text-2xl font-bold flex items-center">
                <!-- 빨간 점 애니메이션 -->
                <span class="w-2 h-2 bg-red-500 rounded-full mr-3 animate-pulse"></span>
                <span id="current-title"></span>
            </h2>
            <span class="text-sm text-gray-400" id="current-count"></span>
        </div>
        <!-- 카드가 들어갈 자리 -->
        <div id="current-container" class="w-full"></div>
    </section>

    <!-- 3. 지난 전시 아카이브 섹션 (Archive) -->
    <section class="px-6 py-20 mx-auto" id="archive-section">
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-12 space-y-4 md:space-y-0">
            <div>
                <h2 class="text-xl md:text-2xl font-bold mb-2" id="archive-title"></h2>
                <p class="text-sm text-gray-500" id="archive-subtitle"></p>
            </div>
            
            <!-- 필터 버튼 영역 -->
            <div class="flex items-center space-x-2 overflow-x-auto pb-2 md:pb-0" id="filter-container">
                <!-- 자바스크립트로 버튼이 생성됩니다 -->
            </div>
        </div>

        <!-- 그리드 레이아웃: 모바일 1열 -> 태블릿 2열 -> PC 3열 -->
        <div id="archive-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-16">
            <!-- 자바스크립트로 카드가 생성됩니다 -->
        </div>

        <!-- 더보기 버튼 -->
        <div class="mt-20 text-center">
            <button class="inline-flex items-center px-8 py-3 border border-gray-300 rounded-full text-sm font-bold hover:bg-black hover:text-white hover:border-black transition-all duration-300">
                LOAD MORE
            </button>
        </div>
    </section>

    <!-- Footer가 제거된 상태입니다. 기존 페이지의 푸터 위에 이 코드를 배치하세요. -->

    <!-- 
      =================================================================
      [로직 스크립트 영역]
      데이터를 화면에 그려주는 코드입니다.
      =================================================================
    -->
    <script>
        // 초기 필터 상태
        let currentFilter = 'All';

        // 1. 설정값 적용 (가로폭 및 텍스트)
        function applyConfig() {
            // 가로폭 적용
            document.getElementById('header-section').style.maxWidth = PAGE_CONFIG.layout.headerWidth;
            document.getElementById('current-section').style.maxWidth = PAGE_CONFIG.layout.currentSectionWidth;
            document.getElementById('archive-section').style.maxWidth = PAGE_CONFIG.layout.archiveSectionWidth;
            // footerWidth 적용 코드 제거됨

            // 텍스트 적용
            document.getElementById('page-title').textContent = PAGE_CONFIG.text.pageTitle;
            document.getElementById('page-subtitle').innerHTML = PAGE_CONFIG.text.pageSubtitle;
            document.getElementById('current-title').textContent = PAGE_CONFIG.text.currentSectionTitle;
            document.getElementById('current-count').textContent = `${CURRENT_EXHIBITIONS_DATA.length} Exhibition`;
            document.getElementById('archive-title').textContent = PAGE_CONFIG.text.archiveSectionTitle;
            document.getElementById('archive-subtitle').textContent = PAGE_CONFIG.text.archiveSubtitle;
        }

        // 2. 카드 HTML 생성 함수 (템플릿 리터럴 사용)
        function createCardHTML(exhibition, type) {
            const isLarge = type === 'featured';
            
            // 이미지 플레이스홀더 (Unsplash 랜덤 이미지)
            const imageUrl = `https://source.unsplash.com/random/800x600?art,abstract&sig=${exhibition.id}`;
            
            return `
                <div class="group cursor-pointer flex flex-col ${isLarge ? 'h-full' : ''}">
                    <!-- 이미지 영역 -->
                    <div class="relative overflow-hidden bg-gray-100 mb-4 ${isLarge ? 'aspect-[16/9] md:aspect-[21/9]' : 'aspect-[4/3]'}">
                        <!-- 배경 이미지 -->
                        <div class="absolute inset-0 bg-gray-200 group-hover:bg-gray-300 transition-colors duration-500">
                            <div class="w-full h-full opacity-30 bg-cover bg-center transition-transform duration-700 group-hover:scale-105"
                                 style="background-image: url('${imageUrl}'); background-color: ${exhibition.color}">
                            </div>
                            <!-- 오버레이 -->
                            <div class="absolute inset-0 bg-black/10 group-hover:bg-black/0 transition-colors duration-500"></div>
                        </div>
                        <!-- 상태 뱃지 -->
                        <div class="absolute top-4 left-4 bg-white/90 backdrop-blur px-3 py-1 text-xs font-bold uppercase tracking-wider">
                            ${exhibition.status}
                        </div>
                    </div>

                    <!-- 텍스트 정보 -->
                    <div class="flex flex-col flex-grow">
                        <div class="flex items-start justify-between mb-2">
                            <div class="text-xs font-medium text-gray-500 flex items-center">
                                <i data-lucide="calendar" class="w-3 h-3 mr-1"></i>
                                ${exhibition.date}
                            </div>
                            ${isLarge ? `
                            <div class="text-xs font-medium text-gray-500 flex items-center">
                                <i data-lucide="map-pin" class="w-3 h-3 mr-1"></i>
                                ${exhibition.location}
                            </div>
                            ` : ''}
                        </div>
                        
                        <h3 class="font-bold mb-2 group-hover:text-blue-600 transition-colors ${isLarge ? 'text-2xl md:text-4xl' : 'text-xl'}">
                            ${exhibition.title}
                        </h3>
                        
                        <p class="text-gray-600 mb-4 line-clamp-2 ${isLarge ? 'text-base md:text-lg max-w-2xl' : 'text-sm'}">
                            ${exhibition.description}
                        </p>

                        <div class="mt-auto pt-2 flex items-center text-sm font-bold uppercase tracking-wider group-hover:translate-x-2 transition-transform duration-300">
                            View Detail <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>
                        </div>
                    </div>
                </div>
            `;
        }

        // 3. 현재 전시 렌더링
        function renderCurrent() {
            const container = document.getElementById('current-container');
            container.innerHTML = CURRENT_EXHIBITIONS_DATA.map(item => createCardHTML(item, 'featured')).join('');
        }

        // 4. 지난 전시 렌더링 (필터링 포함)
        function renderArchive() {
            const container = document.getElementById('archive-container');
            
            // 필터링 로직
            const filteredData = currentFilter === 'All' 
                ? PAST_EXHIBITIONS_DATA 
                : PAST_EXHIBITIONS_DATA.filter(item => item.year === currentFilter);
            
            // HTML 주입
            container.innerHTML = filteredData.map(item => createCardHTML(item, 'standard')).join('');
            
            // 아이콘 다시 로드 (새로 생긴 요소들을 위해)
            lucide.createIcons();
        }

        // 5. 필터 버튼 생성 및 이벤트
        function renderFilters() {
            const years = ['All', '2023', '2022'];
            const container = document.getElementById('filter-container');
            
            // 버튼 HTML 생성
            const buttonsHTML = years.map(year => {
                const isActive = currentFilter === year;
                const activeClass = "bg-black text-white border-black";
                const inactiveClass = "bg-white text-gray-500 border-gray-200 hover:border-gray-400";
                
                return `<button onclick="handleFilterClick('${year}')" 
                        class="px-4 py-2 rounded-full text-sm font-medium transition-all duration-300 border ${isActive ? activeClass : inactiveClass}">
                        ${year}
                        </button>`;
            }).join('');
            
            // 검색 버튼 추가
            const searchButton = `<div class="w-px h-6 bg-gray-200 mx-2"></div>
                                  <button class="p-2 text-gray-400 hover:text-black transition-colors">
                                    <i data-lucide="search" class="w-5 h-5"></i>
                                  </button>`;

            container.innerHTML = buttonsHTML + searchButton;
            lucide.createIcons();
        }

        // 필터 클릭 핸들러 (전역 함수로 등록)
        window.handleFilterClick = function(year) {
            currentFilter = year;
            renderFilters(); // 버튼 상태 업데이트
            renderArchive(); // 그리드 다시 그리기
        };

        // 6. 초기 실행
        window.onload = function() {
            applyConfig();
            renderCurrent();
            renderFilters();
            renderArchive();
            lucide.createIcons(); // 아이콘 초기 로드
        };
    </script>
</body>
</html>
